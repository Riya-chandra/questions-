//Question: Implement event delegation for multiple buttons inside a parent div.

 <div id="parent">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
</div> 

<Script>
    document.getElementById("parent").addEventListener("click", function(e){
        if(e.target.tagname==="BUTTON"){
            console.log("clicked" ,e.target.innerText);
        }
    })
</Script>
